name: SideKixDemo
options:
  bundleIdPrefix: com.davidmorenoengineer
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  ComposableArchitecture:
    url: https://github.com/pointfreeco/swift-composable-architecture
    exactVersion: 1.17.1
  # TCA re-exports these, but the app target links them directly: Xcode 16.2 does not
  # link a package's transitive modules into the app on its own.
  SwiftDependencies:
    url: https://github.com/pointfreeco/swift-dependencies
    from: 1.17.1
  IdentifiedCollections:
    url: https://github.com/pointfreeco/swift-identified-collections
    from: 1.1.1
  CasePaths:
    url: https://github.com/pointfreeco/swift-case-paths
    from: 1.10.0
  Clocks:
    url: https://github.com/pointfreeco/swift-clocks
    from: 1.1.1
  ConcurrencyExtras:
    url: https://github.com/pointfreeco/swift-concurrency-extras
    from: 1.4.3
  CustomDump:
    url: https://github.com/pointfreeco/swift-custom-dump
    from: 1.6.0
  # Transitive dependency pinned to a release that builds with Xcode 16.2 (Swift 6.0).
  SwiftNavigation:
    url: https://github.com/pointfreeco/swift-navigation
    exactVersion: 2.2.3
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  SideKixDemo:
    type: application
    platform: iOS
    sources: [SideKixDemo]
    dependencies:
      - package: ComposableArchitecture
      - package: SwiftDependencies
        product: Dependencies
      - package: IdentifiedCollections
        product: IdentifiedCollections
      - package: CasePaths
        product: CasePaths
      - package: Clocks
        product: Clocks
      - package: ConcurrencyExtras
        product: ConcurrencyExtras
      - package: CustomDump
        product: CustomDump
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.davidmorenoengineer.sidekixdemo
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: SideKix
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  SideKixDemoTests:
    type: bundle.unit-test
    platform: iOS
    sources: [SideKixDemoTests]
    dependencies:
      - target: SideKixDemo
      - package: ComposableArchitecture
      - package: SwiftDependencies
        product: Dependencies
      - package: IdentifiedCollections
        product: IdentifiedCollections
      - package: CasePaths
        product: CasePaths
      - package: Clocks
        product: Clocks
      - package: ConcurrencyExtras
        product: ConcurrencyExtras
      - package: CustomDump
        product: CustomDump
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.davidmorenoengineer.sidekixdemo.tests
schemes:
  SideKixDemo:
    build:
      targets:
        SideKixDemo: all
    test:
      targets: [SideKixDemoTests]
